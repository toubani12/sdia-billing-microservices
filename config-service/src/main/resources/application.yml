server:
  port: 9999

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          # override with CONFIG_REPO_URI=file:///path/to/local/repo to work offline
          # (use a repo with NO remote: for file:// URIs the server resets the working copy to origin)
          uri: ${CONFIG_REPO_URI:https://github.com/toubani12/sdia-billing-microservices.git}
          search-paths: config-repo
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
