server:
  port: 8081

spring:
  application:
    name: customer-service
  config:
    # optional: the service still starts (with local defaults) if config-service is down
    import: optional:configserver:http://localhost:9999
  datasource:
    url: jdbc:h2:mem:customers-db
  h2:
    console:
      enabled: true
  data:
    rest:
      base-path: /api
